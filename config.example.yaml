# Copy to config.yaml and fill in. config.yaml holds secrets: never commit it.

# relay  = your iPhone stays home and relays texts to the dumbphone from your own number (free).
# twilio = no iPhone; you text commands to a Twilio number instead (about $1/month plus per-text fees).
transport: relay

# The dumbphone's number (its own SIM and plan). Write it the way BlueBubbles shows it, e.g. +15551234567.
owner_number: "+15551234567"

host: "127.0.0.1"
port: 8787

# BlueBubbles Server on your Mac, signed in to the same Apple ID as your iPhone.
bluebubbles:
  url: "http://127.0.0.1:1234"
  password: "your-bluebubbles-server-password"
  # Long random string. Put it in the BlueBubbles webhook URL:
  #   http://<this server>:8787/bluebubbles?token=<webhook_token>
  webhook_token: "change-me-to-a-long-random-string"

# Your contacts sync from the Mac's Contacts app (which syncs from your iPhone), so @henry just works.
# Optional extra short names go here. They win over the address book. Phone numbers or Apple ID emails.
contacts:
  mom: "+15550001111"
  sam: "sam@icloud.com"

# Optional. Codes are sent over plain SMS, so keep bank and email accounts off this list.
twofa:
  pin: "0421"                   # keep the quotes
  accounts:
    github: "JBSWY3DPEHPK3PXP"  # the setup key shown under the QR code

# Optional. Transit directions from your own OpenTripPlanner (see scripts/setup-otp-dc.sh).
directions:
  otp_url: "http://127.0.0.1:8080"
  geocoder_url: "https://nominatim.openstreetmap.org"
  viewbox: "-77.6,39.2,-76.6,38.6"   # only look up places in the DC area (lon,lat,lon,lat)
  places:                            # names you can use in "go home to work"
    home: "1600 Pennsylvania Ave NW, Washington, DC"
    work: "38.8977,-77.0365"         # an address or lat,lon

# Optional. Claude, through your own Anthropic account (an API key from console.anthropic.com, billed
# separately from a Claude subscription). Fixes typo'd commands the built-in spellchecker can't, and
# summarizes group chats you mute. Prefer the ANTHROPIC_API_KEY environment variable over writing the key
# here; for the launchd service, put it in the agent's EnvironmentVariables or keep it in this file
# (chmod 600). Commands with a PIN-like run of digits are never sent. With summaries on, the messages from a
# muted group chat are sent to Anthropic to be summarized; set summaries: false to keep them on this Mac.
anthropic:
  # api_key: "sk-ant-..."
  model: "claude-opus-5-5"    # claude-haiku-5-5 is cheaper and faster for this
  summaries: true

# Optional. `call mom` rings the dumbphone from your main number, then connects you to Mom showing it too.
# Needs a Twilio account with your main number added under Verified Caller IDs, and `pip install -e '.[twilio]'`.
# calls:
#   account_sid: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
#   auth_token: "your-twilio-auth-token"
#   caller_id: "+15551234567"   # your main number, as verified in Twilio

# Optional. Alternatively, a small model on your own machine (used only if there's no anthropic section) for typos the built-in spellchecker can't fix (which
# needs no setup). Only used when a text doesn't parse and the spellchecker has no answer, and anything it turns into a message asks you to confirm first.
# Defaults to llama.cpp's llama-server on port 8081 (scripts/install-mac-services.sh starts it).
# For Ollama instead: url "http://127.0.0.1:11434", model "qwen2.5:3b".
llm:
  url: "http://127.0.0.1:8081"
  model: "qwen"

data_dir: "./data"

# Only for transport: twilio.
# public_url: "https://openbrick.example.com"
